[project]
name = "pdf-rag-chatbot"
version = "0.1.0"
description = "PageWise PDF question-answering app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "python-multipart==0.0.20",
    "pymupdf==1.26.4",
    "openai==1.109.1",
    "pydantic-settings==2.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
